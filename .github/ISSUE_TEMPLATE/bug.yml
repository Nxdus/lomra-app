name: Bug report
description: Something in Lomra does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This issue is **public**. Do not paste API keys, passwords, private files, or personal details, and check screenshots first (Settings → Agents can show your email).
        Report a security vulnerability [privately](https://github.com/Nxdus/lomra-app/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Lomra version
      description: Shown at the bottom of Settings. Use the commit if you run from source.
      placeholder: 0.0.7
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card and its memory (VRAM)
      description: Task Manager → Performance → GPU. Write "none" if there is no dedicated card.
      placeholder: NVIDIA RTX 3060, 12 GB
    validations:
      required: true
  - type: input
    id: memory
    attributes:
      label: Computer memory (RAM)
      placeholder: 16 GB
  - type: dropdown
    id: kind
    attributes:
      label: Was a model involved?
      options:
        - No model
        - Local model (Ollama, Stable Diffusion, local 3D, Whisper)
        - Hosted model (OpenRouter, Fal.AI, Google AI)
        - Agent or signed-in account (Claude Code, Codex, OpenCode, ChatGPT, Gemini)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model name
      placeholder: SD Turbo
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use sample data you can share.
      placeholder: |
        1. Open …
        2. Choose …
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
      description: Copy the exact error text and remove keys, names, and file paths you do not want public.
    validations:
      required: true
  - type: checkboxes
    id: safe
    attributes:
      label: Before you submit
      options:
        - label: I removed API keys, passwords, private files, and personal details.
          required: true
        - label: This is not a security vulnerability.
          required: true
