name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Check release version
        id: version
        if: github.ref_type == 'tag'
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$' -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Use a vMAJOR.MINOR.PATCH tag matching apps/desktop/package.json ($version)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --cwd apps/frontend --frozen-lockfile
      - run: bun install --cwd apps/desktop --frozen-lockfile
      - run: bun run --cwd apps/frontend test
      - run: bun run --cwd apps/frontend lint
      - run: bun run --cwd apps/frontend build
      - run: bun run --cwd apps/desktop test
      - name: Package Windows installer
        if: github.ref_type == 'tag'
        run: bun run --cwd apps/desktop electron-builder --win nsis --x64 --publish never
      - name: Upload Windows installer
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer
          path: apps/desktop/dist/Lomra-${{ steps.version.outputs.version }}-windows-x64.exe
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-installer
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          installer="release/Lomra-${GITHUB_REF_NAME#v}-windows-x64.exe"
          test -s "$installer"
          gh release create "$GITHUB_REF_NAME" "$installer" --verify-tag --generate-notes
